<body>
<div id="stage">
<div id="bar"><i></i></div>
<!--SLIDES-->
<div id="notes"></div>
<div id="hud"></div>
<div id="tipbox"></div>
</div>
<div id="pv"></div>
<script>
/* 무대 맞춤: 다른 스크립트보다 먼저 실행해 첫 화면이 튀지 않게 한다 */
(function(){var st=document.getElementById('stage');
 function fit(){var k=Math.min(innerWidth/1600,innerHeight/900);st.style.transform='scale('+k+') translate(-50%, -50%)';}
 fit();addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,250)});
 if(window.visualViewport)visualViewport.addEventListener('resize',fit);})();
</script>

</script>
